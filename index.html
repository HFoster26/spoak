<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPOAK</title>
  <style>
    body {
      font-family: Georgia, serif;
      background: #0f2e27;
      color: #FFFFFF;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      justify-content: center;
    }
    nav {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 2.5em;
      padding: 1.2em 0;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-size: 0.85rem;
    }
    nav a { color: #FFFFFF; text-decoration: none; opacity: 0.75; }
    nav a:hover, nav a:focus { opacity: 1; text-decoration: underline; }
    nav a[aria-current="page"] {opacity: 1; border-bottom: 1px solid #FFFFFF; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    h1 {
      font-size: 2.5rem;
      letter-spacing: 0.3em;
      margin-bottom: 0.2em;
    }
    .subtitle {
      font-style: italic;
      opacity: 0.7;
      margin-bottom: 3em;
    }
    .standings {
      display: flex;
      gap: 3em;
      flex-wrap: wrap;
      justify-content: center;
    }
    .house {
      text-align: center;
    }
    .house-name {
      font-size: 1.2rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    .house-points {
      font-size: 3rem;
      margin-top: 0.2em;
    }
    .bugle .house-points { color: #5797ff; }
    .cedar .house-points { color: #D4826B; }
    .harp  .house-points { color: #3cc904; }
    .lantern .house-points { color: #FFD24A }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" aria-current="page">Standings</a>
    <a href="lore.html"Houses>Houses</a>
  </nav>

  <main>
    <h1>SPOAK</h1>
    <p class="subtitle"> The Society for Peoples Of All Kinds </p>
    <div class="standings" id="standings" role="list" aria-label="House standings"></div>
  </main>


  <script>
    fetch('points.json')
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('standings');
        Object.keys(data).sort().forEach(house => {
          const div = document.createElement('div');
          div.className = 'house ' + house.toLowerCase();
          div.setAttribute('role', 'listitem');
          div.innerHTML =
          '<div class="house-name">' + house + '</div>' +
          '<div class="house-points">' + data[house] + '</div>';
        container.appendChild(div);
      });
    });
  </script>
</body>
</html>
