<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPOAK</title>
  <style>
    body {
      font-family: Georgia, serif;
      background: #0f2e27;
      color: #FFFFFF;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      justify-content: center;
    }
    nav {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 2.5em;
      padding: 1.2em 0;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-size: 0.85rem;
    }
    nav a { color: #FFFFFF; text-decoration: none; opacity: 0.75; }
    nav a:hover, nav a:focus { opacity: 1; text-decoration: underline; }
    nav a[aria-current="page"] {opacity: 1; border-bottom: 1px solid #FFFFFF; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    h1 {
      font-size: 2.5rem;
      letter-spacing: 0.3em;
      margin-bottom: 0.2em;
    }
    .subtitle {
      font-style: italic;
      opacity: 0.7;
      margin-bottom: 3em;
    }
    .standings {
      display: flex;
      gap: 3em;
      flex-wrap: wrap;
      justify-content: center;
    }
    .house {
      text-align: center;
    }
    .house-name {
      font-size: 1.2rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    .house-points {
      font-size: 3rem;
      margin-top: 0.2em;
    }
    .bugle   .house-points { color: #5797ff; }
    .cedar   .house-points { color: #D4826B; }
    .harp    .house-points { color: #3cc904; }
    .lantern .house-points { color: #FFD24A; }

    .cup {
      width: 90px;
      height: 110px;
      margin: 0.8em auto;
      position: relative;
      border: 2px solid rgba(255, 255, 255, 0.65);
      border-top: none;
      border-radius: 0 0 12px 12px;
      overflow: hidden;
    }
    .bead {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%
      transition: transform 0.55s cubic-bezier(0.3, 0.9, 0.55, 1.12);
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" aria-current="page">Standings</a>
    <a href="lore.html"Houses>Houses</a>
  </nav>

  <main>
    <h1>SPOAK</h1>
    <p class="subtitle"> The Society for Peoples Of All Kinds </p>
    <div class="standings" id="standings" role="list" aria-label="House standings"></div>
  </main>


  <script>
    const COLORS = {
      "Bugle":   "#5797ff",
      "Cedar":   "#D4826B",
      "Harp":    "#3cc904",
      "Lantern": "#FFD24A"
    };

    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // Bead layout: rows of 7, packed bottom-up, alternate rows offset
    // for a honey comb sit. Cup interior is 86x108; ~70 beads fill it.
    function beadPos(i) {
      const perRow = 7, step = 11.5, size = 10;
      const row = Math.floor(i / perRow);
      const col = i % perRow;
      const offset = (row % 2) ? 5 : 0;
      const left = 3 + col * step + offset;
      const top = 108 - size - row * 10;
      return { left: left, top: top };
    }

    function pourBeads(cup, count, color) {
      const maxVisible = 70; // cup capacity; the numeral stays the truth
      const n = Math.min(count, maxVisible);
      for (let i = 0; i < n; i++) {
        const pos = beadPos(i);
        if (pos.top < 0) break;
        const bead = document.createElement("div");
        bead.className = "bead";
        bead.style.background = color;
        bead.style.left = pos.left + "px";
        bead.style.top = pos.top + "px";
        if (reduced) {
          cup.appendChild(bead);
        } else {
          bead.style.transform = "translateY(" + (-(pos.top + 140)) + "px)";
          cup.appendChild(bead);
          const delay = Math.min(i * 45, 3500) + Math.random() * 40;
          setTimeout(() => { bead.style.transform = "translateY(0)"; }, 250 + delay);
        }
      }
    }
    
    fetch('points.json')
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('standings');
        Object.keys(data).sort().forEach(house => {
          const div = document.createElement('div');
          div.className = 'house ' + house.toLowerCase();
          div.setAttribute('role', 'listitem');
          div.innerHTML =
          '<div class="house-name">' + house + '</div>' +
          '<div class="house-points">' + data[house] + '</div>';
        container.appendChild(div);
      });
    });
  </script>
</body>
</html>
