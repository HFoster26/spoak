<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPOAK</title>
  <style>
    body {
      font-family: Georgia, serif;
      background: #0f2e27;
      color: #FFFFFF;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    nav {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 2.5em;
      padding: 1.2em 0;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-size: 0.85rem;
    }
    nav a { color: #FFFFFF; text-decoration: none; opacity: 0.75; }
    nav a:hover, nav a:focus { opacity: 1; text-decoration: underline; }
    nav a[aria-current="page"] { opacity: 1; border-bottom: 1px solid #FFFFFF; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 2em 0;
    }
    h1 {
      font-size: 2.5rem;
      letter-spacing: 0.3em;
      margin-bottom: 0.2em;
    }
    .subtitle {
      font-style: italic;
      opacity: 0.7;
      margin-bottom: 3em;
    }
    .standings {
      display: flex;
      gap: 3em;
      flex-wrap: wrap;
      justify-content: center;
    }
    .house { text-align: center; }
    .house-name {
      font-size: 1.2rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    .house-points {
      font-size: 3rem;
      margin-top: 0.2em;
    }
    .bugle   .house-points { color: #5797ff; }
    .cedar   .house-points { color: #D4826B; }
    .harp    .house-points { color: #3cc904; }
    .lantern .house-points { color: #FFD24A; }

    .cup {
      width: 150px;
      height: 185px;
      margin: 1.1em auto 0;
      position: relative;
      border: 2px solid rgba(255, 255, 255, 0.65);
      border-top: none;
      border-radius: 0 0 14px 14px;
      overflow: hidden;
    }
    .bead {
      position: absolute;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" aria-current="page">Standings</a>
    <a href="lore.html"Houses>Houses</a>
  </nav>

  <main>
    <h1>SPOAK</h1>
    <p class="subtitle"> The Society for Peoples Of All Kinds </p>
    <div class="standings" id="standings" role="list" aria-label="House standings"></div>
  </main>


  <script>
    const COLORS = {
      "Bugle":   "#5797ff",
      "Cedar":   "#D4826B",
      "Harp":    "#3cc904",
      "Lantern": "#FFD24A"
    };
    const CUP_W = 146, CUP_H = 181; // interior space inside the borders
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // Pick one bead size for ALL cups: the largest size at which the
    // biggest total still fits. Same size everywhere, or the visual lies.
    function fitBeadSize(maxCount) {
      for (let s = 13; s >= 3; s -= 0.5) {
        const perRow = Math.floor((CUP_W - 4) / (s * 1.15));
        const rows = Math.floor((CUP_H - 4) / (s * 0.9));
        if (perRow * rows >= maxCount) return s;
      }
      return 3;
    }
    
    function beadPos(i, s) {
      const step = s * 1.15;
      const perRow = Math.floor((CUP_W - 4) / step);
      const row = Math.floor(i / perRow);
      const col = i % perRow;
      const offset = (row % 2) ? step / 2 : 0
      return { 
        left: 2 + col * step + offset, 
        top: CUP_H - s - 2 - row * (s * 0.9)
      };
    }

    function makeBead(i, s, color) {
      const pos = beadPos(i, s);
      const bead = document.createElement("div");
      bead.className = "bead";
      bead.style.width = s + "px";
      bead.style.height = s + "px";
      bead.style.background = color;
      bead.style.left = pos.left + "px";
      bead.style.top = pos.top + "px";
      return bead;
    }

    function renderCup(cup, oldCount, newCount, color, s) {
      const keep = Math.min(oldCount, newCount);

      // Beads both versions agree on: placed instantly.
      for (let i = 0; i < keep; i++) cup.appendChild(makeBead(i, s, color));

      if (reduced) {
        for (let i = keep; i < newCount; i++) cup.appendChild(makeBead(i, s ,color));
        return;
      }

      if (newCount > oldCount) {
        //Gain: pour the new beads in from above the rim.
        for (let i = oldCount; i < newCount; i++) {
          const bead = makeBead(i, s, color);
          const drop = beadPos(i, s,).top + CUP_H;
          bead.style.transition = "transform 0.55s cubic-bezier(0.3, 0.9, 0.55, 1.12)";
          bead.style.transform = "translateY(" + (-drop) + "px)";
          cup.appendChild(bead);
          const delay = Math.min((i - oldCount) * 45, 3500) + Math.random() * 40;
          setTimeout(() => { bead.style.transform = "translateY(0)"; }, 300 + delay);
        }
      } else if (newCount < oldCount) {
        // LOSS: the forfeited beads sit in place a beat, then eject over the rim.
        for (let i = newCount; i < oldCount; i++) {
          const bead = makeBead(i, s, color);
          bead.style.transition = "transform 0.6s ease-in, opacity 0.6s ease-in";
          cup.appendChild(bead);
          const delay = (i - newCount) * 60;
          setTimeout(() => {
            bead.style.transform = "translateY(-" + (CUP_H + 60) + "px)";
            bead.style.opacity = "0";
          }, 700 + delay);
          setTimeout(() => { bead.remove(); }, 1500 + delay);
        }
      }
    }
    
    fetch('points.json')
      .then(response => response.json())
      .then(data => {
        let seen = {};
        try { seen = JSON.parse(localStorage.getItem('spoak_seen')) || {}; } catch (e) {}

        // Bead size must fit the biggest count involved, old or new,
        // so departing beads have real postions too.
        let basis = 1;
        Object.keys(data).forEach(h => {
          basis = Math.max(basis, data[h], seen[h] || 0);
        });
        const s = fitBeadSize(basis);
        
        const container = document.getElementById('standings');
        Object.keys(data).sort().forEach(house => {
          const div = document.createElement('div');
          div.className = 'house ' + house.toLowerCase();
          div.setAttribute('role', 'listitem');
          div.innerHTML =
          '<div class="house-name">' + house + '</div>' +
          '<div class="house-points">' + data[house] + '</div>' +
          '<div class="cup" aria-hidden="true"></div>';
        container.appendChild(div);
        const old = (typeof seen[house] === 'number') ? seen[house] : 0;
        renderCup(div.querySelector('.cup'), old, data[house], COLORS[house] || '#FFFFFF', s);
      });

      localStorage.setItem('spoak_seen', JSON.stringify(data));
    });
  </script>
</body>
</html>
